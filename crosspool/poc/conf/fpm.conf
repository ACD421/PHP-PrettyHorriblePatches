[global]
error_log = /proc/self/fd/2
daemonize = no

[poolA]
user = www-data
group = www-data
listen = 0.0.0.0:9001
pm = static
pm.max_children = 2
php_admin_value[disable_functions] = exec
php_admin_value[display_errors] = On
php_admin_value[log_errors] = On
php_admin_value[error_log] = /proc/self/fd/2

[poolB]
user = www-data
group = www-data
listen = 0.0.0.0:9002
pm = static
pm.max_children = 2
php_admin_value[display_errors] = On
php_admin_value[log_errors] = On
php_admin_value[error_log] = /proc/self/fd/2
