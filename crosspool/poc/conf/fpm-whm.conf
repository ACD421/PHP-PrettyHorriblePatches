[global]
error_log = /proc/self/fd/2
daemonize = no

[poolA]
user = www-data
group = www-data
listen = 0.0.0.0:9001
pm = static
pm.max_children = 2
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
php_admin_value[display_errors] = On

[poolB]
user = www-data
group = www-data
listen = 0.0.0.0:9002
pm = static
pm.max_children = 2
php_admin_value[display_errors] = On
